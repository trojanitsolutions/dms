<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In — Luxury Stationery Field Sales</title>
<link rel="stylesheet" href="/sales-login/style.css">
</head>
<body>

<!-- Decorative corner line-art -->
<svg class="deco-line deco-line--tl" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
  <path d="M0 120 C 40 60, 90 20, 200 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M0 170 C 60 120, 120 70, 230 60" fill="none" stroke="currentColor" stroke-width="1"/>
</svg>
<svg class="deco-line deco-line--br" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
  <path d="M240 120 C 200 180, 150 220, 40 230" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M240 70 C 180 120, 120 170, 10 180" fill="none" stroke="currentColor" stroke-width="1"/>
</svg>

<main class="page" role="main">

  <!-- Centered header -->
  <div class="brand">
    {% if company_logo %}
    <img src="{{ company_logo }}" alt="Company Logo" class="brand-logo">
    {% else %}
    <div class="brand-badge">LS</div>
    {% endif %}
    <span class="brand-divider" aria-hidden="true"></span>
    <div class="brand-name">Luxury Stationery Wholesale</div>
  </div>

  <p class="page-subtitle">Sign in to access your sales workspace</p>

  <!-- Login card -->
  <div class="form-inner">
    {% if error == "access-denied" %}
    <div class="error-banner visible" role="alert">
      <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
      </svg>
      <span>Your account doesn't have Sales Rep access. Contact your administrator.</span>
    </div>
    {% endif %}

    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive">
      <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
      </svg>
      <span id="error-text"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <div class="field-header">
          <label class="field-label" for="usr">Email address</label>
        </div>
        <div class="field-input-wrap">
          <svg class="field-icon field-icon--leading" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-width="1.5" d="M2.5 5.5h15v9h-15v-9zM2.5 5.5l7.5 5.5 7.5-5.5"/>
          </svg>
          <input class="field-input" type="email" id="usr" name="usr"
                 placeholder="you@company.com" required
                 autocomplete="username" inputmode="email">
        </div>
      </div>

      <div class="field">
        <div class="field-header">
          <label class="field-label" for="pwd">Password</label>
        </div>
        <div class="field-input-wrap">
          <svg class="field-icon field-icon--leading" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
            <rect x="4.5" y="9" width="11" height="8" rx="1.5" stroke-width="1.5"/>
            <path d="M6.5 9V6a3.5 3.5 0 017 0v3" stroke-width="1.5"/>
          </svg>
          <input class="field-input field-input--password" type="password" id="pwd" name="pwd"
                 placeholder="••••••••" required
                 autocomplete="current-password">
          <button type="button" class="field-icon-btn field-icon-btn--trailing" id="pwd-toggle"
                  aria-label="Show password" aria-pressed="false">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
              <path stroke-width="1.5" d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/>
              <circle cx="10" cy="10" r="2.5" stroke-width="1.5"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="sign-in-btn">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-label">Sign in</span>
      </button>
    </form>
  </div>

  <!-- Footer below card -->
  <div class="page-footer">
    <p class="page-footer-line">
      <svg class="footer-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true">
        <path stroke-width="1.5" d="M10 2l6.5 2.5v4.8c0 4-2.8 6.7-6.5 8.2-3.7-1.5-6.5-4.2-6.5-8.2V4.5L10 2z"/>
        <path stroke-width="1.5" d="M7.3 10l1.9 1.9 3.5-3.9"/>
      </svg>
      Secure access to your workspace
    </p>
    <p class="page-footer-line page-footer-line--sub">
      <span class="footer-dash" aria-hidden="true"></span>
      Powered by <strong>Trojan Technologies</strong>
    </p>
  </div>

</main>

<script src="/sales-login/script.js"></script>
</body>
</html>
